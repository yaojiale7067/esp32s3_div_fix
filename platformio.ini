; ESP32-DIV — PlatformIO port.
; 目标板：ESP32-S3 N16R8（16MB QIO flash + 8MB OPI PSRAM）
; 屏幕：240x320 ILI9341 SPI（TFT 引脚见 lib/TFT_eSPI/User_Setup.h）
; 触摸：FT6336 电容触摸（I2C，引脚见 src/shared.h）
; SD 卡：与 TFT 共用同一条 SPI 总线，CS = 4
; nRF24：独立 SPI3，CSN = 15
; CC1101：与 nRF24 共用 SPI3 的 SCK/MISO/MOSI，CSN = 5，GDO0 = 6
;
; 已移除：PCF8574 物理按键、XPT2046 电阻触摸、蜂鸣器、WS2812 状态灯。
; 完整说明见 README.md。

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8：flash 走 QIO、PSRAM 走 OPI。memory_type 一次性决定 SDK 目录与 boot mode。
board_build.arduino.memory_type = qio_opi
board_build.psram = enable
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv

build_flags =
	-DCORE_DEBUG_LEVEL=1
	-DENABLE_BLE=1

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 依赖全部固定在 lib/ 下，不联网拉取：
;   lib/TFT_eSPI           2.5.43（含本板 User_Setup.h）
;   lib/FT6336-arduino     FT6336 触摸驱动
;   lib/NimBLE-Arduino     BLE 协议栈（BleCompat.h 做别名适配）
;   lib/IRremoteESP8266    IR 收发
;   lib/Adafruit_PN532     RFID/NFC（+ lib/Adafruit_BusIO）
;   lib/SmartRC-CC1101     Sub-GHz 驱动（已改为共享 SPI3 总线）
;   lib/rc-switch          OOK 编解码（Replay Attack / Saved Profile）
;   lib/ArduinoJson        设置/配置读写
;   lib/arduinoFFT         WiFi 频谱